general:
  log syslog: false
  log stdout: true
receivers:
- listen:
  - 0.0.0.0:12345
pipelines:
- if: event.type == "nginx"
  then:
  - name: grok
    field: message
    remove: true
    patterns:
    - '^(?P<clientip>%{IPV4}|%{IPV6}) (?P<identd>[^ ]+) (?P<auth>[^ ]+) \[%{HTTPDATE:timestamp}\] \"(?:(?P<verb>[^ ]+) (?P<request>([^ \"\\]+|\\.)+)(?: HTTP/%{NUMBER:httpversion:float})?|(?P<rawrequest>([^\"]|\\.)*))\" %{NUMBER:response:int} (?:%{NUMBER:bytes:int}|-) \"(?P<referrer>(?:[A-Za-z][A-Za-z+\-.]*://(?P<referrer_host>(?:[^\"\\/]+|\\[^/])*)(?:[^\"\\]+|\\.)*|(?:[^\"\\]+|\\.)*))\" \"(?P<useragent>(?:[^\"\\]+|\\.)*)\" \"(?P<forwardedfor>(?:[^\"\\]+|\\.)*)\"'
  - name: add_tag
    tag: access_logs
  - name: date
    field: timestamp
    remove: true
    formats:
    - '02/Jan/2006:15:04:05 -0700'
  - name: geoip
    field: clientip
  - name: user_agent
    field: useragent
    remove: true
- else:
  - name: add_tag
    tag: unknown_event
network:
  transport: doris-https
  database: logs
  table: access_logs
  # Map important fields to columns for efficient querying
  columns:
  - "@timestamp"
  - message
  - host
  - path
  - type
  - tags
  - clientip
  - verb
  - request
  - response
  - bytes
  - rest
  # Unmapped fields like referrer, useragent, etc. go into the rest JSON column
  rest json column: rest
  servers:
  - doris-fe:8030
  username: root
  password: ""
  ssl ca: /path/to/ca.crt
  routines: 4
  retry backoff: 1s
  retry backoff max: 300s
